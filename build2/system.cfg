[connectivity]
nk=architecture_top_a:1:architecture_top_a
nk=architecture_top_b:1:architecture_top_b

slr=architecture_top_a:SLR0
slr=architecture_top_b:SLR1

# --- Kernel A: reads HBM[0..7] ---
sp=architecture_top_a.A_in_mem_0:HBM[0]
sp=architecture_top_a.A_in_mem_1:HBM[1]
sp=architecture_top_a.A_in_mem_2:HBM[2]
sp=architecture_top_a.A_in_mem_3:HBM[3]
sp=architecture_top_a.A_in_mem_4:HBM[4]
sp=architecture_top_a.A_in_mem_5:HBM[5]
sp=architecture_top_a.A_in_mem_6:HBM[6]
sp=architecture_top_a.A_in_mem_7:HBM[7]
# --- Kernel A: writes HBM[8..15] ---
sp=architecture_top_a.B_out_mem_0:HBM[8]
sp=architecture_top_a.B_out_mem_1:HBM[9]
sp=architecture_top_a.B_out_mem_2:HBM[10]
sp=architecture_top_a.B_out_mem_3:HBM[11]
sp=architecture_top_a.B_out_mem_4:HBM[12]
sp=architecture_top_a.B_out_mem_5:HBM[13]
sp=architecture_top_a.B_out_mem_6:HBM[14]
sp=architecture_top_a.B_out_mem_7:HBM[15]

# --- Kernel B: reads HBM[16..23] ---
sp=architecture_top_b.A_in_mem_0:HBM[16]
sp=architecture_top_b.A_in_mem_1:HBM[17]
sp=architecture_top_b.A_in_mem_2:HBM[18]
sp=architecture_top_b.A_in_mem_3:HBM[19]
sp=architecture_top_b.A_in_mem_4:HBM[20]
sp=architecture_top_b.A_in_mem_5:HBM[21]
sp=architecture_top_b.A_in_mem_6:HBM[22]
sp=architecture_top_b.A_in_mem_7:HBM[23]
# --- Kernel B: writes HBM[24..31] ---
sp=architecture_top_b.B_out_mem_0:HBM[24]
sp=architecture_top_b.B_out_mem_1:HBM[25]
sp=architecture_top_b.B_out_mem_2:HBM[26]
sp=architecture_top_b.B_out_mem_3:HBM[27]
sp=architecture_top_b.B_out_mem_4:HBM[28]
sp=architecture_top_b.B_out_mem_5:HBM[29]
sp=architecture_top_b.B_out_mem_6:HBM[30]
sp=architecture_top_b.B_out_mem_7:HBM[31]

[clock]
freqHz=250000000:architecture_top_a.ap_clk
freqHz=250000000:architecture_top_b.ap_clk

[vivado]
prop=run.impl_1.STEPS.OPT_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=EarlyBlockPlacement
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
impl.jobs=16
synth.jobs=16

[profile]
exec=architecture_top_a:all