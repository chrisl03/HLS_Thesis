[connectivity]
nk=architecture_top_level:1:architecture_top_level
# Map to SLR
slr=architecture_top_level:SLR0
 
# K=64: 8 read (HBM 0-7) + 8 write (HBM 16-23)
# instance name = architecture_top_level (ΧΩΡΙΣ _1, λογω nk=)
sp=architecture_top_level.A_in_mem_0:HBM[0]
sp=architecture_top_level.A_in_mem_1:HBM[1]
sp=architecture_top_level.A_in_mem_2:HBM[2]
sp=architecture_top_level.A_in_mem_3:HBM[3]
sp=architecture_top_level.A_in_mem_4:HBM[4]
sp=architecture_top_level.A_in_mem_5:HBM[5]
sp=architecture_top_level.A_in_mem_6:HBM[6]
sp=architecture_top_level.A_in_mem_7:HBM[7]
 
sp=architecture_top_level.B_out_mem_0:HBM[16]
sp=architecture_top_level.B_out_mem_1:HBM[17]
sp=architecture_top_level.B_out_mem_2:HBM[18]
sp=architecture_top_level.B_out_mem_3:HBM[19]
sp=architecture_top_level.B_out_mem_4:HBM[20]
sp=architecture_top_level.B_out_mem_5:HBM[21]
sp=architecture_top_level.B_out_mem_6:HBM[22]
sp=architecture_top_level.B_out_mem_7:HBM[23]
 
[clock]
freqHz=250000000:architecture_top_level.ap_clk
 
[vivado]
impl.jobs=16
synth.jobs=16
prop=run.impl_1.STEPS.OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.OPT_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=EarlyBlockPlacement
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
 
[profile]
data=architecture_top_level:all:all